<p-menubar [model]="items">
  <ng-template pTemplate="end">
    <button
      *ngIf="auth.isGuest()"
      pButton
      label="Login"
      icon="pi pi-sign-in"
      class="p-button-text"
      (click)="goLogin()"
    ></button>

    <button
      *ngIf="!auth.isGuest()"
      pButton
      label="Logout"
      icon="pi pi-sign-out"
      class="p-button-text"
      (click)="logout()"
    ></button>
  </ng-template>
</p-menubar>
