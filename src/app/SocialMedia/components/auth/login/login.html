<div class="flex flex-col gap-4 w-full max-w-sm mx-auto mt-20 p-8 bg-slate-900/50 border border-white/10 rounded-2xl backdrop-blur-md">
  <h2 class="text-2xl font-bold text-white mb-2 text-center">Inicia Sesión</h2>
  <p class="text-slate-400 text-sm text-center mb-4">Bienvenido de nuevo a Miiverse</p>

  <div class="flex flex-col gap-1.5">
    <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider ml-1">Email</label>
    <input
      type="email"
      [(ngModel)]="email"
      placeholder="tu@email.com"
      class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder:text-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all"
    />
  </div>

  <div class="flex flex-col gap-1.5">
    <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider ml-1">Contraseña</label>
    <input
      type="password"
      [(ngModel)]="password"
      placeholder="••••••••"
      class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder:text-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all"
    />
  </div>

  <button 
    (click)="login()"
    class="w-full mt-4 py-3 bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-500 hover:to-blue-600 text-white font-bold rounded-xl shadow-lg shadow-blue-500/20 transform active:scale-95 transition-all"
  >
    Entrar
  </button>

  <small class="text-red-400 text-center font-medium" *ngIf="error">{{ error }}</small>
</div>
