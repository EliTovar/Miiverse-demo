<form class="mv-auth-card" (ngSubmit)="login()">
  <h2>Inicia sesión</h2>
  <p class="mv-auth-subtitle">Bienvenido de nuevo a Miiverse</p>

  <div class="mv-field">
    <label for="login-email">Email</label>
    <input id="login-email" name="email" type="email" autocomplete="email"
           [(ngModel)]="email" placeholder="tu@email.com" />
  </div>

  <div class="mv-field">
    <label for="login-password">Contraseña</label>
    <input id="login-password" name="password" type="password" autocomplete="current-password"
           [(ngModel)]="password" placeholder="••••••••" />
  </div>

  <button type="submit" class="mv-auth-submit">Entrar</button>

  <small class="mv-auth-error" *ngIf="error">{{ error }}</small>

  <p class="mv-auth-switch">¿No tienes cuenta? <a routerLink="/auth/register">Crea una</a></p>
</form>
