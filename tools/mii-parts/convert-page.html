<!doctype html>
<!-- Página que usa convert.cjs (no es parte de la app). Convierte piezas DAE del Mii a GLB con Three.js. -->
<html><body>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { ColladaLoader } from 'three/addons/loaders/ColladaLoader.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const loader = new ColladaLoader();
const exporter = new GLTFExporter();

/** ColladaLoader nombra los huesos "joint0, joint1…": recuperamos el nombre real (Arm_1_L…) del DAE. */
function jointNames(daeText) {
  const map = {};
  for (const m of daeText.matchAll(/<node[^>]*name="([^"]+)"[^>]*sid="([^"]+)"[^>]*type="JOINT"/g)) map[m[2]] = m[1];
  return map;
}

/** Material blanco con el nombre del "slot" (Body, Hair, Head…) para teñirlo en la app. */
function cleanMesh(mesh) {
  const slot = mesh.name.split('__mt_').pop();
  const geometry = mesh.geometry;
  ['color', 'uv1', 'uv2'].forEach((a) => geometry.deleteAttribute(a));
  mesh.geometry = mergeVertices(geometry, 1e-5); // geometría indexada: ~3 veces menos peso
  mesh.material = new THREE.MeshStandardMaterial({ name: slot, color: 0xffffff, roughness: 0.8 });
}

/** Piezas de cabeza: en reposo se ven igual sin huesos, así que las dejamos como mallas rígidas. */
function unskin(root) {
  const group = new THREE.Group();
  root.traverse((o) => {
    if (!o.isMesh) return;
    o.geometry.deleteAttribute('skinIndex');
    o.geometry.deleteAttribute('skinWeight');
    const mesh = new THREE.Mesh(o.geometry, o.material);
    mesh.name = o.name;
    o.updateWorldMatrix(true, false);
    mesh.applyMatrix4(o.matrixWorld);
    group.add(mesh);
  });
  return group;
}

async function toBase64(buffer) {
  const bytes = new Uint8Array(buffer);
  let s = '';
  for (let i = 0; i < bytes.length; i += 8192) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  return btoa(s);
}

window.convertPart = async (srcPath, rigid) => {
  const text = await (await fetch('/src/' + srcPath)).text();
  const names = jointNames(text);
  const scene = loader.parse(text, '').scene;
  scene.scale.setScalar(1); // ColladaLoader aplica pulgadas→metros (0.0254); la app decide su escala
  scene.traverse((o) => {
    if (o.isBone && names[o.name]) o.name = names[o.name];
    if (o.isMesh) cleanMesh(o);
  });
  scene.children.filter((c) => c.isLight).forEach((l) => scene.remove(l));
  scene.updateMatrixWorld(true);
  const root = rigid ? unskin(scene) : scene;
  return toBase64(await exporter.parseAsync(root, { binary: true }));
};

window.ready = true;
</script>
</body></html>
